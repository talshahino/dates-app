name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/deploy-functions.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy notify
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase functions deploy notify --project-ref rbupwfcqodfgqmiugmsj --no-verify-jwt --use-api
      - name: Waiting for the access token
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "Add SUPABASE_ACCESS_TOKEN in the repo secrets, then run this workflow again."
