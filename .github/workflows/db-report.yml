name: Database report

on:
  push:
    branches: [main]
    paths: ['supabase/checks/usage.sql']
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          out=$(curl -sS -X POST "https://api.supabase.com/v1/projects/rbupwfcqodfgqmiugmsj/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data "$(jq -Rs '{query: .}' < supabase/checks/usage.sql)" | tr '\n' ' ')
          echo "::notice title=report::$out"
