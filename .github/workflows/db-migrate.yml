name: Apply database changes

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', '.github/workflows/db-migrate.yml']
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Run migrations (all are safe to re-run)
        run: |
          set -e
          for f in $(ls supabase/migrations/*.sql | sort); do
            body=$(jq -Rs '{query: .}' < "$f")
            code=$(curl -sS -o out.json -w "%{http_code}" -X POST \
              "https://api.supabase.com/v1/projects/rbupwfcqodfgqmiugmsj/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              --data "$body")
            msg=$(head -c 400 out.json | tr '\n' ' ')
            if [ "$code" -ge 300 ]; then echo "::error title=migrate::$f -> $code $msg"; exit 1; fi
            echo "::notice title=migrate::$f -> $code $msg"
          done
